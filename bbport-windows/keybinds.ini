# bbport keyboard and mouse (Dark Souls III layout), written by the launcher's
# Controls page; the game reads it at start. Delete it to get the defaults back.
# action = inputs separated by spaces; shift+, ctrl+ or alt+ make combinations.

keybinds_version = 3

move_forward   = w                          # Move forward
move_back      = s                          # Move back
move_left      = a                          # Move left
move_right     = d                          # Move right
walk           = c                          # Walk (hold)
circle         = lshift                     # Dodge / dash (hold) / jump while dashing; back in menus
l3             = space                      # Jump while dashing (L3)
r3             = q mouse_middle             # Lock on / reset camera (R3)
camera_up      = i                          # Camera up
camera_down    = k                          # Camera down
camera_left    = j                          # Camera left
camera_right   = l                          # Camera right
r1             = mouse_left                 # Attack (R1)
r2             = mouse_right                # Strong attack (R2)
l1             = h                          # Transform weapon (L1)
l2             = shift+mouse_right f        # Firearm (L2)
cross          = e enter                    # Interact; confirm in menus (Cross)
square         = t                          # Use quick item (Square)
triangle       = r                          # Blood vial (Triangle)
up             = up wheel_up                # D-pad up
down           = down wheel_down            # Switch quick item (d-pad down)
left           = left shift+wheel_down      # Switch left hand weapon (d-pad left)
right          = right shift+wheel_up       # Switch right hand weapon (d-pad right)
options        = tab                        # Game menu (Options)
touchpad       = g                          # Gestures (touchpad)
touchpad_right = backspace                  # Right half of the touchpad (debug menu)

mouse_camera        = 1
mouse_sensitivity   = 3.02
mouse_sensitivity_y = 1.00
mouse_invert_x      = 0
mouse_invert_y      = 0
mouse_no_auto_rotation = 1
walk_tilt           = 0.40
ds3_jump            = 1
